<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vault &middot; Focus & Notes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stars"></div>
  <div class="galaxy"></div>
  <div class="vignette"></div>

  <div id="bootOverlay" class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo">Vault</div>
        <p>Loading your space...</p>
      </div>
    </div>
  </div>

  <div id="vaultApp" class="vault" hidden>
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-logo">Vault</div>
      </div>

      <div class="sidebar-user">
        <div class="avatar" id="userAvatar">?</div>
        <span class="username" id="userName">...</span>
      </div>

      <div class="nav-label">Notes</div>

      <div class="add-note">
        <input class="input" type="text" id="newNoteInput" placeholder="New note title..." maxlength="60" />
        <button class="btn btn-primary" id="addNoteBtn" title="Add note">+</button>
      </div>

      <div class="notes-scroll" id="notesList"></div>

      <div class="sidebar-foot">
        <button class="logout-btn" id="changePwBtn">&#9881; Change password</button>
        <button class="logout-btn danger" id="logoutBtn">&#8623; Log out</button>
      </div>
    </aside>

    <!-- ============ Main: Pomodoro ============ -->
    <main class="main">
      <div class="app-content">
        <header class="app-header">
          <div class="app-title">Pomodoro</div>
          <div class="app-sub">One interval at a time &mdash; stay in the zone.</div>
        </header>

        <div class="timer-card">
          <div class="mode-switch">
            <button class="mode-btn active" data-mode="focus">Focus</button>
            <button class="mode-btn" data-mode="short">Short</button>
            <button class="mode-btn" data-mode="long">Long</button>
          </div>

          <div class="dial">
            <svg viewBox="0 0 230 230" class="ring">
              <circle class="ring-track" cx="115" cy="115" r="105"></circle>
              <circle class="ring-progress" id="progressRing" cx="115" cy="115" r="105"></circle>
            </svg>
            <div class="dial-center">
              <span class="time" id="timeDisplay">25:00</span>
              <span class="phase" id="phaseLabel">Focus</span>
              <span class="focus-badge" id="focusBadge">0 sessions complete</span>
            </div>
          </div>

          <div class="controls">
            <button class="btn btn-primary" id="startBtn">Start</button>
            <button class="btn" id="stopBtn">Stop</button>
            <button class="btn" id="resetBtn">Reset</button>
          </div>

          <div class="status-line" id="statusLine">Ready when you are.</div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Change password modal -->
  <div class="modal-overlay" id="pwModal" hidden>
    <div class="modal-card">
      <div class="modal-title">Change password</div>
      <div class="form-error" id="pwError"></div>
      <form id="pwForm" novalidate>
        <div class="field">
          <label for="pwCurrent">Current password</label>
          <input class="input" type="password" id="pwCurrent" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="pwNew">New password</label>
          <input class="input" type="password" id="pwNew" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="pwConfirm">Confirm new password</label>
          <input class="input" type="password" id="pwConfirm" autocomplete="new-password" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="pwCancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="pwSubmit">Update</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
